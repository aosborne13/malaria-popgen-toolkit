name: malaria-popgen
channels:
  - conda-forge
  - bioconda
dependencies:
  # ---- Core Python ----
  - python >=3.9
  - pip
  - pandas
  - numpy
  - matplotlib
  - seaborn
  - geopandas
  - shapely
  - pyproj
  - fiona
  - geodatasets

  # ---- CLI tools ----
  - bcftools
  - htslib
  - samtools
  - tabix

  # ---- R + dependencies ----
  - r-base
  - r-devtools          # required (not optional)
  - r-tidyverse         # ggplot2, dplyr, stringr, readr, tibble, purrr, etc.
  - r-optparse          # <-- needed for run_hmmibd_from_matrix.R
  - r-ggrepel
  - r-data.table
  - r-gt
  - r-ape
  - r-qqman
  - r-rehh
  - r-igraph
  - r-rcolorbrewer
  - r-scales
  - r-amap
  - r-crayon
  
  # ---- Admixture mapping (tess3r-admixture) ----
  - r-rworldmap         # getMap() basemap for the interpolated ancestry map
  - r-fields            # spatial interpolation used by tess3r::ggtess3Q
  - r-maps

  # ---- For building R/tess3r ----
  - r-remotes
  - r-rcpp
  - r-rcpparmadillo

  # (hmmIBD is compiled from source in scripts/setup_env.sh)
